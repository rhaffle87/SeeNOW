name: Release Standalone Binaries

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build-binaries:
    name: Build Binary (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: SeeNOW-Windows-x64.zip
            target_os: windows
          - os: ubuntu-latest
            artifact_name: SeeNOW-Linux-x64.tar.gz
            target_os: linux
          - os: macos-latest
            artifact_name: SeeNOW-macOS-arm64.zip
            target_os: macos

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install dependencies (Linux headless X11 / Tkinter)
      if: matrix.target_os == 'linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y python3-tk libtk8.6 libx11-dev

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip setuptools
        pip install -r requirements.txt

    - name: Build Standalone Application with PyInstaller
      run: |
        python build_exe.py

    - name: Package Windows Binary
      if: matrix.target_os == 'windows'
      run: |
        Compress-Archive -Path dist/SeeNOW/* -DestinationPath ${{ matrix.artifact_name }}

    - name: Package Linux Binary
      if: matrix.target_os == 'linux'
      run: |
        tar -czvf ${{ matrix.artifact_name }} -C dist/SeeNOW .

    - name: Package macOS Binary
      if: matrix.target_os == 'macos'
      run: |
        cd dist/SeeNOW && zip -r ../../${{ matrix.artifact_name }} .

    - name: Upload Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.artifact_name }}
        path: ${{ matrix.artifact_name }}
        retention-days: 1

  publish-release:
    name: Publish GitHub Release & Checksums
    needs: [build-binaries]
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: release_artifacts
        merge-multiple: true

    - name: Generate SHA256 Checksums
      run: |
        cd release_artifacts
        sha256sum * > SHA256SUMS.txt
        cat SHA256SUMS.txt

    - name: Publish Release to GitHub
      uses: softprops/action-gh-release@v2
      with:
        files: |
          release_artifacts/*
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
